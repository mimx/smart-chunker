[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "smart-chunker"
version = "1.2.0"
description = "Structure-aware document chunking for AI knowledge systems"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/mimx/smart-chunker"
"Bug Tracker" = "https://github.com/mimx/smart-chunker/issues"
